<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="790" viewBox="0 0 1320 790" role="img" aria-label="历历在练当前功能思维导图"><title>历历在练当前功能思维导图</title><rect width="100%" height="100%" fill="#fff"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#71877d" stroke-width="1.2"/></marker></defs><text x="42" y="47" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="27" font-weight="650" fill="#263d33">当前实现范围 · 功能思维导图</text><text x="42" y="79" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#667c70">依据仓库现状整理；可选能力受配置约束，不代表本轮验收通过。</text><path d="M525,405 C460,405 460,215 395,215" fill="none" stroke="#71877d" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="642.5" y="748" width="35" height="23" rx="3" fill="white"/><text x="660" y="765" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="14" font-weight="400" fill="#263d33"></text><rect x="35" y="130" width="360" height="170" rx="10" fill="#f3f7f4" stroke="#bdcfc5"/><text x="53" y="161" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="20" font-weight="650" fill="#263d33">会话与恢复</text><path d="M35,174 H395" stroke="#cbd8d1"/><text x="53" y="202" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">新建、打开、重命名与删除确认</text><text x="53" y="228" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">消息、附件和稿件本地或云端保存</text><text x="53" y="254" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">已保存回合重放与中断恢复</text><path d="M525,405 C460,405 460,430 395,430" fill="none" stroke="#71877d" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="642.5" y="748" width="35" height="23" rx="3" fill="white"/><text x="660" y="765" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="14" font-weight="400" fill="#263d33"></text><rect x="35" y="345" width="360" height="170" rx="10" fill="#f3f7f4" stroke="#bdcfc5"/><text x="53" y="376" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="20" font-weight="650" fill="#263d33">材料与用途</text><path d="M35,389 H395" stroke="#cbd8d1"/><text x="53" y="417" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">文字 / MD / DOCX / 文字型 PDF</text><text x="53" y="443" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">PNG / JPEG 保存与可选转录</text><text x="53" y="469" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">用途澄清、部分提取提示、来源版本</text><path d="M525,405 C460,405 460,645 395,645" fill="none" stroke="#71877d" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="642.5" y="748" width="35" height="23" rx="3" fill="white"/><text x="660" y="765" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="14" font-weight="400" fill="#263d33"></text><rect x="35" y="560" width="360" height="170" rx="10" fill="#f3f7f4" stroke="#bdcfc5"/><text x="53" y="591" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="20" font-weight="650" fill="#263d33">安全与成本</text><path d="M35,604 H395" stroke="#cbd8d1"/><text x="53" y="632" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">事实、会话、章节、版本检查</text><text x="53" y="658" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">明确采用后才写稿</text><text x="53" y="684" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">本机统一预算，上限人民币 30 元</text><path d="M795,405 C860,405 860,215 925,215" fill="none" stroke="#71877d" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="642.5" y="748" width="35" height="23" rx="3" fill="white"/><text x="660" y="765" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="14" font-weight="400" fill="#263d33"></text><rect x="925" y="130" width="360" height="170" rx="10" fill="#f3f7f4" stroke="#bdcfc5"/><text x="943" y="161" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="20" font-weight="650" fill="#263d33">对话与建议</text><path d="M925,174 H1285" stroke="#cbd8d1"/><text x="943" y="202" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">限定默认章节、指定范围、逐段推进</text><text x="943" y="228" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">追问、采用、拒绝、调整与跳过</text><text x="943" y="254" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">改写理由与原句依据按需查看</text><path d="M795,405 C860,405 860,430 925,430" fill="none" stroke="#71877d" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="642.5" y="748" width="35" height="23" rx="3" fill="white"/><text x="660" y="765" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="14" font-weight="400" fill="#263d33"></text><rect x="925" y="345" width="360" height="170" rx="10" fill="#f3f7f4" stroke="#bdcfc5"/><text x="943" y="376" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="20" font-weight="650" fill="#263d33">当前稿与交付</text><path d="M925,389 H1285" stroke="#cbd8d1"/><text x="943" y="417" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">初版只读 / 编辑 / 安全预览</text><text x="943" y="443" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">自动保存、失败保留、版本冲突</text><text x="943" y="469" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">复制及 Markdown 下载选中正文</text><path d="M795,405 C860,405 860,645 925,645" fill="none" stroke="#71877d" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="642.5" y="748" width="35" height="23" rx="3" fill="white"/><text x="660" y="765" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="14" font-weight="400" fill="#263d33"></text><rect x="925" y="560" width="360" height="170" rx="10" fill="#f3f7f4" stroke="#bdcfc5"/><text x="943" y="591" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="20" font-weight="650" fill="#263d33">联网与可选输入</text><path d="M925,604 H1285" stroke="#cbd8d1"/><text x="943" y="632" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">会话授权、岗位候选与正文核对</text><text x="943" y="658" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">运行中补充、换岗与中断接续</text><text x="943" y="684" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">后端语音回填草稿，校对后发送</text><rect x="525" y="352" width="270" height="106" rx="18" fill="#285a4b"/><text x="660" y="395" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="28" font-weight="650" fill="white">历历在练</text><text x="660" y="430" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="17" font-weight="400" fill="white">真实材料 → 确认 → 当前稿</text><text x="660" y="767" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="17" font-weight="400" fill="#667c70">不含：扫描 PDF OCR、语音输出、Word 