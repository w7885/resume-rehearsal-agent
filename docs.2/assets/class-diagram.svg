t="400" fill="#263d33">suggestion_id / target_block_id</text><text x="938" y="668" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">expected_block_revision / status</text><text x="938" y="694" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">before_text / after_text / reason</text><rect x="920" y="850" width="360" height="170" rx="10" fill="#f3f7f4" stroke="#bdcfc5"/><text x="938" y="881" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="20" font-weight="650" fill="#263d33">Decision · 用户决定</text><path d="M920,894 H1280" stroke="#cbd8d1"/><text x="938" y="922" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">suggestion_id / decision</text><text x="938" y="948" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">accept / reject / revise</text><text x="938" y="974" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">feedback；用户答复另有关联回执</text><rect x="460" y="850" width="360" height="170" rx="10" fill="#fff8e9" stroke="#bdcfc5"/><text x="478" y="881" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="20" font-weight="650" fill="#263d33">ProjectBudget · 项目费用账本</text><path d="M460,894 H820" stroke="#cbd8d1"/><text x="478" y="922" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">limit_cents / spent_cents</text><text x="478" y="948" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">reserved / settled / unknown</text><text x="478" y="974" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">不参与会话级联删除</text><text x="35" y="894" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="19" font-weight="650" fill="#263d33">关系说明</text><text x="35" y="927" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">稿块 ↔ 来源：draft_sources</text><text x="35" y="957" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">建议 ↔ 来源：suggestion_sources</text><text x="35" y="987" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">来源二选一约束由数据库检查。</text><text x="35" y="1017" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="15" font-weight="400" fill="#263d33">N : 1 = 多条建议指向一个稿块版本。</text></svg>