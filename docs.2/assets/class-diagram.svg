<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1130" viewBox="0 0 1400 1130" role="img" aria-label="核心领域类图：数据对象及关系"><title>核心领域类图：数据对象及关系</title><rect width="100%" height="100%" fill="#fff"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#71877d" stroke-width="1.2"/></marker></defs><text x="35" y="42" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="27" font-weight="650" fill="#263d33">核心领域类图</text><text x="35" y="72" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#667c70">概念对象映射数据库；箭头表示关联方向，1 / 0..* 表示数量；非源码类全集。</text><path d="M620,110 L620,94 L210,94 L210,300" fill="none" stroke="#71877d" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="222.0" y="98" width="196" height="23" rx="3" fill="white"/><text x="320" y="115" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="14" font-weight="400" fill="#263d33">1 会话拥有 0..* 消息</text><path d="M640,270 L640,300" fill="none" stroke="#71877d" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="563.0" y="274" width="154" height="23" rx="3" fill="white"/><text x="640" y="291" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="14" font-weight="400" fill="#263d33">1 → 0..* 附件</text><path d="M820,190 L1250,190 L1250,300" fill="none" stroke="#71877d" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="962.0" y="161" width="196" height="23" rx="3" fill="white"/><text x="1060" y="178" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="14" font-weight="400" fill="#263d33">1 会话拥有 0..* 运行</text><path d="M210,460 L210,570" fill="none" stroke="#71877d" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="91.0" y="507" width="238" height="23" rx="3" fill="white"/><text x="210" y="524" text-anchor="middle" font-family="Microsoft 