<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="520" viewBox="0 0 1320 520" role="img" aria-label="联网领域对象关系：与个人事实分离"><title>联网领域对象关系：与个人事实分离</title><rect width="100%" height="100%" fill="#fff"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#71877d" stroke-width="1.2"/></marker></defs><text x="35" y="42" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="27" font-weight="650" fill="#263d33">联网领域对象关系</text><text x="35" y="76" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="17" font-weight="400" fill="#263d33">概念关系；外部岗位资料不证明个人经历，也不能自行授权改稿。</text><path d="M390,190 L470,190" fill="none" stroke="#71877d" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="395.0" y="159" width="70" height="23" rx="3" fill="white"/><text x="430" y="176" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="14" font-weight="400" fill="#263d33">1 : 1</text><path d="M830,190 L910,190" fill="none" stroke="#71877d" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="835.0" y="159" width="70" height="23" rx="3" fill="white"/><text x="870" y="176" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="14" font-weight="400" fill="#263d33">1 : N</text><path d="M1090,270 L1090,370 L830,370" fill="none" stroke="#71877d" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="983.0" y="313" width="154" height="23" rx="3" fill="white"/><text x="1060" y="330" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="14" font-weight="400" fill="#263d33">建议绑定来源与授权版本</text><rect x="30" y="110" width="360" height="160" rx="10" fill="#f3f7f4" stroke="#bdcfc5"/><text x="48" y="141" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="20" font-weight="650" fill="#263d33">Session · 会话</text><path d="M30,154 H390" stroke="#cbd8d1"/><text x="48" y="182" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">显示名称 / 实际求职目标</text><text x="48" y="208" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">联网开关 / 授权版本</text><text x="48" y="234" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">会话拥有多个外部参考版本</text><rect x="470" y="110" width="360" height="160" rx="10" fill="#f3f7f4" stroke="#bdcfc5"/><text x="488" y="141" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="20" font-weight="650" fill="#263d33">WebTarget · 当前岗位目标</text><path d="M470,154 H830" stroke="#cbd8d1"/><text x="488" y="182" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">目标标识 / 公司 / 职位</text><text x="488" y="208" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">地点 / 用工类型 / 岗位编号</text><text x="488" y="234" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">换岗后旧结果不可用于新目标</text><rect x="910" y="110" width="360" height="160" rx="10" fill="#f3f7f4" stroke="#bdcfc5"/><text x="928" y="141" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="20" font-weight="650" fill="#263d33">ExternalReference · 外部参考</text><path d="M910,154 H1270" stroke="#cbd8d1"/><text x="928" y="182" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">岗位 / 公司 / 术语资料</text><text x="928" y="208" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">网址 / 正文 / 来源版本</text><text x="928" y="234" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">与个人 SourceBlock 分开保存</text><rect x="470" y="310" width="360" height="160" rx="10" fill="#f3f7f4" stroke="#bdcfc5"/><text x="488" y="341" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="20" font-weight="650" fill="#263d33">Suggestion · 待确认建议</text><path d="M470,354 H830" stroke="#cbd8d1"/><text x="488" y="382" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">个人事实引用仍需有效</text><text x="488" y="408" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">外部引用校验目标与授权</text><text x="488" y="434" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#263d33">采用前再次检查有效版本</text><text x="35" y="503" text-anchor="start" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="17" font-weight="400" fill="#263d33">关闭联网、换岗或来源失效后，旧外部引用不能绕过校验进入当前稿。</text></svg>